name: Conditional Example
on: workflow_dispatch
jobs:
  conditional:
    runs-on: ubuntu-latest
    steps:
      - name: Show Run ID
        run: echo "Run ID = ${{ github.run_id }}"

      - name: Print Hello
        if: ${{ contains(github.run_id, '1') }}
        run: echo "Hello"
      
      - name: Print Goodbye
        run: echo "GoodBye"
        if: ${{ !contains(github.run_id, '1') }}