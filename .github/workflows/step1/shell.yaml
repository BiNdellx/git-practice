name: Shell Command # ID
on: workflow_dispatch # event-trigger
jobs: # task unit
  run: # job id - 사용자 임의로 작성 가능
    runs-on: ubuntu-latest # 실행 환경
    steps: # 실행 최소 단위
      - name: Check environment # step 1의 이름(ID)
        run: | # 여러 명령어 실행
          echo "Current directory:"
          pwd
          echo "File list:"
          ls -la
      - name: Check file
        run: |
          if [ -f "README.md" ]; then
            echo "File exists"
          else
            echo "File not found"
          fi
      - name: Repeat commands
        run: |
          for i in 1 2 3
          do
            echo "Test $i"
          done
      - name: Use environment variable
        env:
          MESSAGE: Hello
        run: echo "$MESSAGE"