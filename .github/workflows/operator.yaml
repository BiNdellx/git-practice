name: Operator Example
on: workflow_dispatch
jobs:
  operator:
    runs-on: ubuntu-latest
    steps:
      - name: Logical Operator
        run: |
          echo "AND: ${{ true && false }}"
          echo "OR: ${{ true || false }}"
          echo "NOT: ${{ !true }}"
      - name: Comparison Operator
        run: |
          echo "Equal: ${{ 10 == 10 }}"
          echo "Not Equal: ${{ 10 != 20 }}"
          echo "Greater: ${{ 10 > 5 }}"
          echo "Less: ${{ 10 < 5 }}"
          echo "Greater Equal ${{ 10 >= 10 }}"
          echo "Less Equal ${{ 10 <= 20 }}"
          echo "Type Error ${{ false == 1 }}"

      - name: Grouping
        run: |
          echo "Group 1: ${{ (true || false) && false }}"
          echo "Group 2: ${{ true || (false && false) }}"
          echo "Group 3: ${{ (10 > 5) && (20 > 10) }}"

      - name: Index
        run: |
          echo "First: ${{ fromJSON('["Apple","Banana","Cherry"]')[0] }}"
          echo "Second: ${{ fromJSON('["Apple","Banana","Cherry"]')[1] }}"
          echo "Third: ${{ fromJSON('["Apple","Banana","Cherry"]')[2] }}"
