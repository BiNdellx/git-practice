name: Issue Comment Example
on:
  push:
permissions:
  issues: write
jobs:
  comment:
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # 1. GitHub CLI 사용
      - name: Create Issue with GitHub CLI
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues" \
            -f title="Issue from GitHub CLI" \
            -f body="Created by GitHub Actions using GitHub CLI." \
            --jq '.html_url'

      # 2. curl 사용
      - name: Create Issue with curl
        run: |
          curl -L --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues" \
            -d '{"title":"Issue from curl","body":"Created by GitHub Actions using curl."}'
